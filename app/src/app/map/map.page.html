<ion-content [fullscreen]="true" [scrollY]="false" [scrollX]="false" class="map-content">
  <div id="map-container" #mapDiv></div>

  <!-- backend offline banner -->
  <div class="backend-banner" *ngIf="backendOk === false">
    Backend offline — start it with <code>uvicorn main:app --port 8000</code>
  </div>

  <!-- top: search or nav banner -->
  <app-nav-banner
    *ngIf="(navState$ | async)?.phase === 'navigating' || (navState$ | async)?.phase === 'rerouting'"
    (onCancel)="onCancelNav()">
  </app-nav-banner>

  <app-search-bar
    *ngIf="(navState$ | async)?.phase === 'idle' && !chatOpen"
    (placeSelected)="onPlaceSelected($event)">
  </app-search-bar>

  <!-- weather chip sits below the search pill -->
  <div class="weather-chip nb-glass-soft" *ngIf="!chatOpen && (weather$ | async) && (navState$ | async)?.phase === 'idle'">
    {{ (weather$ | async)?.description }} · {{ (weather$ | async)?.temp }}°
  </div>

  <!-- rain + a flood report nearby: one-tap confirm -->
  @if (floodPrompt; as fp) {
    <div class="flood-prompt nb-glass-soft">
      <div class="flood-prompt-main">
        <div class="flood-prompt-title">🌧 Neighbor reported flooding nearby</div>
        <div class="flood-prompt-sub">"{{ fp.text }}" — still flooded?</div>
      </div>
      <button class="flood-prompt-yes" type="button" (click)="confirmFloodPrompt()">Still flooded</button>
      <button class="flood-prompt-dismiss" type="button" (click)="dismissFloodPrompt()" aria-label="Dismiss">×</button>
    </div>
  }

  <!-- simulation chip -->
  <div class="sim-chip nb-glass-soft" *ngIf="simulating$ | async">
    <span class="sim-dot"></span> Simulated
  </div>

  <!-- right: recenter -->
  <button class="recenter nb-glass" *ngIf="(navState$ | async)?.phase === 'idle' && !chatOpen" (click)="recenter()"
          aria-label="Recenter map">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="8.2"/>
      <line x1="12" y1="1.5" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22.5"/>
      <line x1="1.5" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="22.5" y2="12"/>
    </svg>
  </button>

  <!-- no GPS fix yet: never fake a location, invite the user to enable it -->
  <button class="gps-pill nb-glass" *ngIf="!chatOpen && !(hasFix$ | async) && (navState$ | async)?.phase === 'idle'"
          (click)="enableLocation()">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s-6.5-5.4-6.5-10a6.5 6.5 0 0 1 13 0c0 4.6-6.5 10-6.5 10z"/>
      <circle cx="12" cy="11" r="2.3"/>
    </svg>
    Turn on your location
  </button>

  <!-- route calculation in progress -->
  <div class="routing-pill nb-glass" *ngIf="routing$ | async">
    <span class="routing-spinner"></span> Finding the best route…
  </div>

  <!-- bottom: route preview -->
  <app-route-preview
    *ngIf="(navState$ | async)?.phase === 'preview' && !chatOpen"
    (onStart)="onStartNav()"
    (onCancel)="onCancelNav()">
  </app-route-preview>

  <div class="assistant-dock" *ngIf="!chatOpen && !isTraveling && !aiThinking && (navState$ | async)?.phase === 'idle'">
    <button class="chat-mini nb-glass" type="button"
            [disabled]="chatLocked" [attr.aria-label]="'Open chat with ' + character.name" (click)="openChat()">
      <img class="chat-mini-avatar" [src]="character.avatar" [alt]="character.name" />
      <span class="chat-mini-text">
        <span class="chat-mini-name">{{ character.name }}</span>
        <span class="chat-mini-preview">{{ character.greeting }}</span>
      </span>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round" class="chat-mini-chevron">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <app-mic-fab [disabled]="chatLocked" (voiceToggle)="onMicToggle()"></app-mic-fab>
  </div>

  <app-chat-sheet [open]="chatOpen" [locked]="isTraveling" (closed)="onChatClosed()"></app-chat-sheet>
</ion-content>
