<div class="preview nb-glass" *ngIf="state.route">
  <div class="preview-head">
    <div class="preview-dest">
      <div class="dest-name">{{ state.route.destination.name }}</div>
      <div class="dest-sub" *ngIf="state.route.destination.detail">{{ state.route.destination.detail }}</div>
    </div>
  </div>

  <div class="preview-stats">
    <span class="stat mode">{{ state.route.profile === 'foot-walking' ? 'Walking' : 'Driving' }}</span>
    <span class="stat-dot"></span>
    <span class="stat">{{ distanceLabel }}</span>
    <span class="stat-dot"></span>
    <span class="stat">{{ durationLabel }}</span>
    <ng-container *ngIf="ascentLabel">
      <span class="stat-dot"></span>
      <span class="stat ascent">{{ ascentLabel }}</span>
    </ng-container>
    <span class="source-tag" *ngIf="state.route?.source === 'ors'">ORS</span>
  </div>

  <div class="preview-actions">
    <button class="btn-start" (click)="onStart.emit()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="margin-right:7px;">
        <path d="M8 5v14l11-7z"/>
      </svg>
      Start
    </button>
    <button class="btn-cancel" (click)="onCancel.emit()">Cancel</button>
  </div>
</div>
