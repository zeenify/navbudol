<div class="search-wrap">
  <div class="search-pill nb-glass">
    <ion-searchbar
      aria-label="Search places"
      placeholder="Search a place…"
      [showCancelButton]="'never'"
      [autocomplete]="'off'"
      [spellcheck]="false"
      (ionInput)="onInput($event)"
      (ionFocus)="onFocus()">
    </ion-searchbar>
    <button class="add-location-button" type="button" (click)="openAddLocation()" aria-label="Add a shared location">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <div class="add-location-card nb-glass" *ngIf="showAddLocation">
    <div class="add-location-title">Add a shared location</div>
    <div class="add-location-copy">Save a name at your current GPS position. Everyone using this NavBudol server can find it.</div>
    <input
      class="add-location-input"
      type="text"
      maxlength="80"
      [(ngModel)]="locationName"
      placeholder="e.g. Edrick house"
      autocomplete="off"
    />
    <input
      class="add-location-input"
      type="text"
      maxlength="120"
      [(ngModel)]="locationDetail"
      placeholder="Optional note, like near the chapel"
      autocomplete="off"
    />
    <div class="add-location-error" *ngIf="locationError" role="alert">{{ locationError }}</div>
    <div class="add-location-actions">
      <button class="add-location-cancel" type="button" (click)="closeAddLocation()" [disabled]="savingLocation">Cancel</button>
      <button class="add-location-save" type="button" (click)="saveLocation()" [disabled]="savingLocation || !locationName.trim()">
        {{ savingLocation ? 'Saving…' : 'Save shared location' }}
      </button>
    </div>
  </div>

  <div class="results nb-glass" *ngIf="showResults && (results.length > 0 || searching || showRecents)">
    <div class="result-row" *ngFor="let place of results" (click)="select(place)">
      <div class="result-pin">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
        </svg>
      </div>
      <div class="result-text">
        <div class="result-name">{{ place.name }}</div>
        <div class="result-detail" *ngIf="place.detail">{{ place.detail }}</div>
        <div class="result-warning" *ngIf="place.outsideServiceArea">Outside General Tinio service area</div>
      </div>
    </div>

    <div class="result-note" *ngIf="searching">Searching…</div>

    <ng-container *ngIf="showRecents">
      <div class="result-section">Recent</div>
      <div class="result-row" *ngFor="let recent of recents" (click)="searchRecent(recent)">
        <div class="result-pin recent-icon">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
          </svg>
        </div>
        <div class="result-text"><div class="result-name">{{ recent }}</div></div>
      </div>
    </ng-container>
  </div>

  <div class="results nb-glass" *ngIf="showResults && !searching && results.length === 0 && !showRecents">
    <div class="result-note">No places found</div>
  </div>

  <div class="scrim" *ngIf="showResults" (click)="dismiss()"></div>
</div>
