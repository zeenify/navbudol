<div class="search-wrap">
  <div class="search-pill nb-glass">
    <ion-searchbar
      placeholder="Search a place…"
      [showCancelButton]="'never'"
      [autocomplete]="'off'"
      [spellcheck]="false"
      (ionInput)="onInput($event)"
      (ionFocus)="onFocus()">
    </ion-searchbar>
  </div>

  <div class="results nb-glass" *ngIf="showResults && (results.length > 0 || searching || showRecents)">
    <div class="result-row" *ngFor="let place of results" (click)="select(place)">
      <div class="result-pin">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
        </svg>
      </div>
      <div class="result-text">
        <div class="result-name">{{ place.name }}</div>
        <div class="result-detail" *ngIf="place.detail">{{ place.detail }}</div>
      </div>
    </div>

    <div class="result-note" *ngIf="searching">Searching…</div>

    <ng-container *ngIf="showRecents">
      <div class="result-section">Recent</div>
      <div class="result-row" *ngFor="let recent of recents" (click)="searchRecent(recent)">
        <div class="result-pin recent-icon">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
          </svg>
        </div>
        <div class="result-text"><div class="result-name">{{ recent }}</div></div>
      </div>
    </ng-container>
  </div>

  <div class="results nb-glass" *ngIf="showResults && !searching && results.length === 0 && !showRecents">
    <div class="result-note">No places found</div>
  </div>

  <div class="scrim" *ngIf="showResults" (click)="dismiss()"></div>
</div>
