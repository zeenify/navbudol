<div class="nav-wrap">
  <div class="banner nb-glass">
    <div class="banner-arrow">{{ arrow }}</div>
    <div class="banner-text">
      <div class="banner-instruction">{{ state.nextInstruction }}</div>
    </div>
    <div class="banner-distance" *ngIf="state.phase === 'navigating'">{{ distanceToTurn }}</div>
    <div class="banner-distance rerouting" *ngIf="state.phase === 'rerouting'">Rerouting…</div>
  </div>

  <div class="summary nb-glass">
    <div class="summary-stats">
      <span class="remaining">{{ remainingLabel }}</span>
      <span class="eta">{{ etaLabel }}</span>
    </div>
    <button class="stop-btn" (click)="onCancel.emit()" aria-label="Stop navigation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>
</div>
